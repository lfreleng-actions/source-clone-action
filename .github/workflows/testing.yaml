---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Action test/validation workflow
#
# Interim regime: anonymous HTTPS clones of a few small projects on the
# public O-RAN-SC Gerrit, run for both the composite action and the CLI.
# No credentials are used, so the job is safe to run on pull requests.
# The action clones working copies, the default, and the CLI clones
# bare mirrors (--mirror), so each run covers both modes.
# The GitHub source test uses only the read-only workflow token to list
# and clone this public repository.
# SSH coverage and the content-filter tests return with a disposable
# Gerrit container and a per-run key.
name: "Test GitHub Action 🧪"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

env:
  GERRIT_HOST: "gerrit.o-ran-sc.org"
  # Small, active projects; ric-plt/* and com/* exercise nested paths.
  # Keep the clone set small: this runs against a production server.
  TEST_PROJECTS: "ric-plt/ricctl,ric-plt/conflictmgr,com/golog"
  EXPECTED_COUNT: "3"

jobs:
  tests:
    name: "Test Gerrit Clone"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'audit'

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # Pin the installer too; the action SHA alone leaves uv floating.
          version: '0.13.4'
          python-version: '3.11'

      - name: "Install source-clone CLI"
        shell: bash
        run: |
          # Hash-pinned via uv.lock; --locked rejects lockfile drift.
          uv sync --locked --no-dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: "Test GitHub Action: gerrit.o-ran-sc.org [HTTPS]"
        id: action-https
        uses: $/
        with:
          host: ${{ env.GERRIT_HOST }}
          output-path: "action-https"
          include-projects: ${{ env.TEST_PROJECTS }}
          use-https: "true"

      - name: "Test CLI Tool: gerrit.o-ran-sc.org [HTTPS]"
        shell: bash
        run: |
          source-clone clone \
            --host "$GERRIT_HOST" \
            --output-path "cli-https" \
            --threads "2" \
            --https \
            --skip-archived \
            --mirror \
            --include-projects "$TEST_PROJECTS"

      - name: "Validate clone results [HTTPS]"
        shell: bash
        env:
          ACTION_MANIFEST: ${{ steps.action-https.outputs.manifest-path }}
        run: |
          # Check each run's manifest counts and that every requested
          # project is a clone of the expected kind at its nested path.
          status=0
          for target in "action-https|working copy|$ACTION_MANIFEST" \
            "cli-https|bare mirror|cli-https/clone-manifest.json"; do
            IFS='|' read -r dir kind manifest <<< "$target"
            if [ ! -f "$manifest" ]; then
              echo "::error::$dir: manifest not found ($manifest)"
              status=1
              continue
            fi
            total=$(jq -r '.total' "$manifest")
            ok=$(jq -r '.succeeded' "$manifest")
            failed=$(jq -r '.failed' "$manifest")
            if [ "$total" != "$EXPECTED_COUNT" ] \
              || [ "$ok" != "$EXPECTED_COUNT" ] || [ "$failed" != "0" ]; then
              echo "::error::$dir: total=$total succeeded=$ok" \
                "failed=$failed (expected $EXPECTED_COUNT/$EXPECTED_COUNT/0)"
              status=1
            fi
            IFS=',' read -ra projects <<< "$TEST_PROJECTS"
            for project in "${projects[@]}"; do
              repo="$dir/$project"
              if [ "$kind" = "bare mirror" ]; then
                bare=$(git -C "$repo" rev-parse --is-bare-repository \
                  2>/dev/null) || bare=""
                [ "$bare" = "true" ] && continue
              else
                # An empty prefix means the directory is a repository
                # root; a plain directory would otherwise pass by
                # resolving to the checkout's own .git.
                prefix=$(git -C "$repo" rev-parse --show-prefix \
                  2>/dev/null) || prefix="(not found)"
                tree=$(git -C "$repo" rev-parse --is-inside-work-tree \
                  2>/dev/null) || tree=""
                [ -z "$prefix" ] && [ "$tree" = "true" ] && continue
              fi
              echo "::error::$dir: $project is not a $kind"
              status=1
            done
            {
              echo "### $dir ($kind)"
              echo "- Cloned: $ok/$total (failed: $failed)"
              echo "- Size: $(du -sh "$dir" | awk '{print $1}')"
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"

      # mirror: auto mirrors a Gerrit source, but a GitHub source should
      # still produce a working tree, not a bare mirror. The run also
      # reads its project list from a file inside the workspace.
      - name: "Write GitHub project list file"
        shell: bash
        run: |
          printf '%s\n' '# Project list for the GitHub source test' \
            'source-clone-action' > github-projects.txt

      - name: "Test GitHub Action: github.com [mirror: auto]"
        id: action-github
        uses: $/
        with:
          host: "github.com/lfreleng-actions"
          github-token: ${{ github.token }}
          output-path: "action-github"
          include-projects-file: "github-projects.txt"
          mirror: "auto"
          use-https: "true"

      - name: "Validate GitHub clone is a working tree"
        shell: bash
        env:
          GITHUB_MANIFEST: ${{ steps.action-github.outputs.manifest-path }}
        run: |
          repo="action-github/source-clone-action"
          if [ "$(git -C "$repo" rev-parse --is-inside-work-tree \
            2>/dev/null)" != "true" ] || [ ! -f "$repo/action.yaml" ]; then
            echo "::error::$repo is not a working-tree clone"
            exit 1
          fi
          included=$(jq -c '.config.include_projects' "$GITHUB_MANIFEST")
          if [ "$included" != '["source-clone-action"]' ]; then
            echo "::error::manifest include_projects is $included"
            exit 1
          fi
          echo "- GitHub working tree: $repo" >> "$GITHUB_STEP_SUMMARY"
